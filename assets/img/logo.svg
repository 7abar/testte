<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img"
  aria-label="Hubhood">
  <defs>
    <linearGradient id="hubMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf0b4" />
      <stop offset="1" stop-color="#3fb783" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="#0c0f10" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#5be49b" stroke-opacity="0.28"
    stroke-width="1.5" />

  <!-- hood: an arc sheltering the hub -->
  <path d="M17 39a15 15 0 0 1 30 0" fill="none" stroke="url(#hubMark)" stroke-width="3.4" stroke-linecap="round" />

  <!-- spokes -->
  <g stroke="#5be49b" stroke-opacity="0.5" stroke-width="2.4" stroke-linecap="round">
    <path d="M32 39v8" />
    <path d="M32 39l-8 5.4" />
    <path d="M32 39l8 5.4" />
  </g>

  <!-- hub node -->
  <circle cx="32" cy="38" r="5" fill="#0c0f10" />
  <circle cx="32" cy="38" r="4.2" fill="url(#hubMark)" />
</svg>
